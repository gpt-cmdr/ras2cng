[build-system]
requires = ["hatchling>=1.27,<1.29"]
build-backend = "hatchling.build"

[project]
name = "ras2cng"
version = "0.12.0"
description = "CLI for exporting HEC-RAS geometry/results to cloud-native GIS formats (GeoParquet, PMTiles, DuckDB, PostGIS)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "William M. Katzenmeyer, P.E., C.F.M.", email = "bill@clbengineering.com"}
]
keywords = [
  "hec-ras", "ras-commander", "geoparquet", "pmtiles", "duckdb", "postgis",
  "cloud-native-gis", "flood-modeling", "hydraulics", "geospatial",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Hydrology",
  "Topic :: Utilities",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  # 0.110.3+ installs the Rust HDF engine (ras-commander-fast-hdf >=0.2.4) by
  # default on Windows x64, Linux x64 and macOS arm64, and [full] adds the
  # fast-map engine (ras-commander-fast-map >=0.10.1,<0.12) on Windows x64 and
  # Linux x64. 0.110.2+ maps meshes with invalid cell polygons
  # (``invalid_cells``); 0.110.3 admits fast-map 0.11.
  "ras-commander[full]>=0.110.3",
  "typer>=0.9.0",
  "rich>=13.0.0",
  "pandas>=2.0.0",
  "geopandas>=0.14.0",
  "pyarrow>=14.0.0",
  "h5py>=3.0.0",
]

[project.optional-dependencies]
fast-hdf = [
  # The Rust HDF engine is already a default dependency on supported
  # platforms; this extra requests it explicitly (e.g. for a source build).
  "ras-commander[fast-hdf]>=0.110.3",
]
fast-map = [
  # Rust 2D WSE/Depth mapping for `ras2cng map --engine fast-map`. Already
  # installed by ras-commander[full] on Windows x64 and Linux x64.
  "ras-commander[fast-map]>=0.110.3",
]
duckdb = [
  "duckdb>=1.0.0",
]
postgis = [
  "sqlalchemy>=2.0.0",
  "geoalchemy2>=0.14.0",
  "psycopg2-binary>=2.9.0",
]
pmtiles = [
  # Note: tippecanoe + pmtiles + gdal are CLIs and must be installed separately.
  # This extra just pulls common Python deps used by the module.
  "rasterio>=1.3.0",
  # Pure-Rust raster tiler: replaces the gdaldem/gdalwarp/gdal_translate/
  # gdaladdo/pmtiles CLI chain for raster PMTiles (ras2cng/raster_tiles.py).
  "terrio>=0.5.0",
  # rio-cogeo is the only check that establishes cloud-optimized *layout*.
  # Gate on cog_validate(...)[0] from Python -- the `rio cogeo validate` CLI
  # always exits 0, including on an invalid file.
  "rio-cogeo>=5.0.0",
]
gpio = [
  "geoparquet-io>=0.9",
]
terrio = [
  # In-process raster tiling, colour relief and hillshade; selected by
  # RAS2CNG_RASTER_TILER (auto prefers it when installed).
  "terrio>=0.5.0",
]
freestiler = [
  # In-process vector tiler; an alternative to the tippecanoe + pmtiles CLIs.
  # Selected by RAS2CNG_VECTOR_TILER (auto falls back to it when tippecanoe is
  # absent, e.g. on Windows).  See ras2cng/vector_tiles.py.
  "freestiler>=0.3.0",
]
webgis = [
  "fastapi>=0.115,<1",
  "rio-tiler>=7,<8",
  "rio-cogeo>=5.0.0",
  "uvicorn[standard]>=0.34,<1",
]
all = [
  "duckdb>=1.0.0",
  "sqlalchemy>=2.0.0",
  "geoalchemy2>=0.14.0",
  "psycopg2-binary>=2.9.0",
  "rasterio>=1.3.0",
  "terrio>=0.5.0",
  "fastapi>=0.115,<1",
  "rio-tiler>=7,<8",
  "rio-cogeo>=5.0.0",
  "uvicorn[standard]>=0.34,<1",
  # Prebuilt wheels only for these platforms; elsewhere it needs a Rust build.
  "freestiler>=0.3.0; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

[project.scripts]
ras2cng = "ras2cng.cli:app"

[project.urls]
Homepage = "https://github.com/gpt-cmdr/ras2cng"
Repository = "https://github.com/gpt-cmdr/ras2cng"
Documentation = "https://rascommander.info/ras2cng/"
"Bug Tracker" = "https://github.com/gpt-cmdr/ras2cng/issues"

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "integration: Full extraction tests against real HEC-RAS models (requires I: and L: drives)",
]

[tool.hatch.build.targets.wheel]
packages = ["ras2cng"]

[tool.uv]
dev-dependencies = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "marimo>=0.9.0",
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "mkdocs-git-revision-date-localized-plugin>=1.2.0",
  "twine>=6.2.0",
  "httpx>=0.27.0",
  # Decode raster PMTiles tiles in tests/test_raster_tiles.py.
  "pmtiles>=3.4",
  "pillow>=10.0",
]
